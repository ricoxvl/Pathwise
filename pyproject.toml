[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "pathwise"
version = "0.1.0"
description = "Source-traceable academic prerequisite risk checker (technical proof of concept)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.8,<3",
  "sqlalchemy>=2.0,<3",
  "uvicorn>=0.30,<1",
  "psycopg[binary]>=3.2,<4"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.9,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pathwise = ["data/*.json"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
