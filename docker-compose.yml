services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pathwise
      POSTGRES_PASSWORD: local_only_change_me
      POSTGRES_DB: pathwise
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pathwise -d pathwise"]
      interval: 5s
      retries: 10
    volumes:
      - pathwise_pg:/var/lib/postgresql/data
volumes:
  pathwise_pg:
